<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>liasse — K-1 basis check</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: #666; margin-top: 0; }
  label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
  input[type=file], input[type=text] { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; background: #1a1a1a; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
  button:hover { background: #333; }
  .error { color: #b00020; margin-top: 1rem; }
  .hint { color: #888; font-size: 0.85rem; margin-top: 0.25rem; }
</style>
</head>
<body>
  <h1>liasse</h1>
  <p class="sub">Basis-tracking check for a K-1 extraction.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form action="{{ url_for('check') }}" method="post" enctype="multipart/form-data">
    <label for="k1_file">K-1 extraction JSON</label>
    <input type="file" name="k1_file" id="k1_file" accept=".json" required>
    <p class="hint">A vendor (Lido/K1x) extraction response — or try one of the files in tests/fixtures/ or examples/.</p>

    <label for="ledger_path">Basis ledger CSV path</label>
    <input type="text" name="ledger_path" id="ledger_path" value="{{ default_ledger }}">

    <label for="outbox_path">Outbox folder for drafts</label>
    <input type="text" name="outbox_path" id="outbox_path" value="{{ default_outbox }}">

    <button type="submit">Check basis</button>
  </form>
</body>
</html>
