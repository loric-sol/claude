[project]
name = "liasse"
version = "0.1.0"
description = "Basis-tracking flag layer for K-1s, built on a bought extraction API"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Only needed once you swap in a real extractor (LidoK1Extractor / K1xExtractor).
vendor = ["requests"]
# Only needed to run the local web UI (liasse/webapp.py).
web = ["flask"]

[project.scripts]
liasse = "liasse.cli:main"
liasse-web = "liasse.webapp:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liasse*"]

[tool.setuptools.package-data]
liasse = ["templates/*.html"]
